<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>IRLOS Cloud // Subscriber Dashboard</title>
    <meta name="description" content="Dedicated stream control, live telemetry, and studio manager for IRLOS Cloud subscribers." />
    
    <!-- Exact Fonts from irlos.live -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2308080a'/><rect x='25' y='25' width='50' height='50' fill='%2300d4ff'/></svg>" />

    <!-- Error Diagnostic Catcher -->
    <script>
      window.addEventListener('error', function(event) {
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'debug-error-box';
          errBox.style = 'position:fixed;top:20px;left:20px;right:20px;z-index:99999;background:#08080a;color:#00d4ff;padding:24px;border:2px solid #ef4444;font-family:monospace;box-shadow:4px 4px 0 #ef4444;';
          document.body.prepend(errBox);
        }
        errBox.innerHTML = '<h3 style="color:#ef4444;margin:0 0 10px;font-size:16px;">[IRLOS CLOUD // FRONTEND RUNTIME ERROR]</h3>' +
          '<div style="color:#e8e4da;font-size:13px;margin-bottom:8px;">' + (event.message || event.error) + '</div>' +
          '<div style="color:#948f86;font-size:11px;">Source: ' + (event.filename || 'unknown') + ':' + (event.lineno || '') + '</div>';
      });
    </script>
  </head>
  <body style="background-color:#e8e4da;margin:0;" class="bg-canvasBg text-irloBg font-mono antialiased selection:bg-irloAccent selection:text-irloBg min-h-screen">
    <div id="root">
      <div style="font-family:'JetBrains Mono',monospace;padding:60px 20px;text-align:center;color:#08080a;font-weight:bold;">
        <div style="font-size:18px;letter-spacing:0.1em;margin-bottom:8px;">IRLOS CLOUD // SYSTEMD INITIALIZING</div>
        <div style="font-size:12px;color:#6a655d;">LOADING DASHBOARD MODULES...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
